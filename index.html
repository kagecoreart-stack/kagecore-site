<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KAGECORE | THE VOID</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { margin: 0; background: #000; overflow: hidden; color: #fff; font-family: 'Inter', sans-serif; }
        #canvas-container { position: fixed; top: 0; left: 0; z-index: 1; }
        #ui-layer { position: relative; z-index: 10; pointer-events: none; }
        .interactive { pointer-events: auto; }
        .glitch-header { text-shadow: 2px 0 #ff00c1, -2px 0 #00fff9; font-weight: 900; letter-spacing: -0.05em; }
    </style>
</head>
<body>

    <div id="canvas-container"></div>

    <main id="ui-layer" class="flex flex-col items-center justify-center min-h-screen p-6">
        <div class="interactive text-center space-y-6 bg-black/40 backdrop-blur-md p-12 border border-white/10">
            <h1 class="text-8xl glitch-header uppercase italic">KAGECORE</h1>
            <p class="text-zinc-500 tracking-[0.5em] text-xs uppercase">Shadow Frequency Analysis v2.0</p>
            
            <div class="pt-8">
                <button onclick="triggerAnalysis()" class="px-12 py-4 bg-white text-black font-bold uppercase tracking-widest hover:bg-zinc-300 transition-all">
                    Initiate Scan
                </button>
            </div>
        </div>
    </main>

    <script>
        // --- NEXT-GEN 3D ENGINE (Three.js) ---
        let scene, camera, renderer, particles;

        function init3D() {
            scene = new THREE.Scene();
            camera = new THREE.Camera();
            camera.position.z = 1;

            const geometry = new THREE.PlaneBufferGeometry(2, 2);
            
            // Fragment Shader for the "Liquid Obsidian" effect
            const material = new THREE.ShaderMaterial({
                uniforms: {
                    u_time: { value: 1.0 },
                    u_mouse: { value: new THREE.Vector2() },
                    u_resolution: { value: new THREE.Vector2() }
                },
                vertexShader: `void main() { gl_Position = vec4(position, 1.0); }`,
                fragmentShader: `
                    uniform float u_time;
                    uniform vec2 u_mouse;
                    uniform vec2 u_resolution;

                    void main() {
                        vec2 st = gl_FragCoord.xy / u_resolution.xy;
                        st.x *= u_resolution.x / u_resolution.y;
                        vec2 m = u_mouse / u_resolution.xy;
                        
                        float d = distance(st, m);
                        float color = 0.0;
                        color = sin(d * 10.0 - u_time * 2.0) * 0.5 + 0.5;
                        color *= smoothstep(0.4, 0.0, d);
                        
                        gl_FragColor = vec4(vec3(color * 0.1), 1.0);
                    }
                `
            });

            const mesh = new THREE.Mesh(geometry, material);
            scene.add(mesh);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            document.getElementById('canvas-container').appendChild(renderer.domElement);
            
            onWindowResize();
            window.addEventListener('resize', onWindowResize);
            document.addEventListener('mousemove', (e) => {
                material.uniforms.u_mouse.value.set(e.pageX, u_resolution.y - e.pageY);
            });
            
            animate();
        }

        function onWindowResize() {
            renderer.setSize(window.innerWidth, window.innerHeight);
            // Updating uniforms for the shader
        }

        function animate() {
            requestAnimationFrame(animate);
            renderer.render(scene, camera);
        }

        function triggerAnalysis() {
            document.body.style.cursor = 'wait';
            setTimeout(() => { alert("Frequency locked. Prepare for Shadow Reveal."); }, 1000);
        }

        init3D();
    </script>
</body>
</html>
